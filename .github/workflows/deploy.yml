name: Build & Deploy blog

on:
  push:
    branches: [main]
    # 쓰레드 원고는 사이트 산출물에 들어가지 않습니다.
    # 발행 자동화가 posted 표시를 커밋할 때마다 사이트를 다시 배포할 이유가 없습니다.
    paths-ignore:
      - "content/threads/**"
      - "design/**"
      # 방문 기록은 관리 화면(로컬 전용)에서만 읽습니다. 배포 산출물에 안 들어가므로
      # 하루 한 번 갱신될 때마다 사이트를 다시 배포할 이유가 없습니다.
      - "content/stats.json"
      - "content/search.json"
  workflow_dispatch: # 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # CC_DEPLOY=1 은 로컬 전용 관리 페이지(/admin)를 산출물에서 빼라는 신호입니다.
      # Actions 가 항상 넣어주는 CI=true 로도 같은 판정이 되지만, 배포 의도를 파일에 남겨둡니다.
      - run: node scripts/build.js
        env:
          CC_DEPLOY: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # 배포가 끝난 뒤에 알립니다. 순서가 뒤집히면 검색엔진이 와서 404 를 받고,
      # 그건 안 알린 것만 못합니다. --wait 가 주소가 실제로 뜨는 것까지 확인합니다.
      #
      # 이번 푸시에서 바뀐 글만 보냅니다(--changed). 배포마다 글 전체를 다시 알리면
      # 안 바뀐 주소를 되풀이해 보내는 셈이라 429 를 맞고, 그때는 진짜 새 글도 같이 막힙니다.
      # 스타일만 고친 배포는 알릴 것이 없다고 찍고 정상으로 끝납니다.
      #
      # fetch-depth: 0 이 필요합니다. 기본값 1 로는 이전 커밋이 없어서 무엇이 바뀌었는지 못 봅니다.
      # npm ci 는 하지 않습니다. indexnow.js 는 의존성 없이 돌게 돼 있고,
      # 설치가 한 번 실패하면 알림이 통째로 멈추기 때문입니다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 새 글을 IndexNow 로 알림 (네이버·Bing 등)
        run: node scripts/indexnow.js --changed --wait
        env:
          INDEXNOW_BASE: ${{ github.event.before }}
