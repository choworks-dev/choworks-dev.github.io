name: 쓰레드 알림

# 10분마다 큐를 확인합니다. 다음 편의 예약 시각이 120분 안쪽이면 그 회차가 그 편을 맡고,
# 남은 시간은 스크립트 안에서 기다렸다가 예약 시각에 정확히 원고를 텔레그램으로 보냅니다.
# 올리는 것은 사람이 합니다. 이 워크플로는 쓰레드에 아무것도 쓰지 않습니다.
#
# 회차가 도는 시각에 바로 보내지 않는 이유는, 깃허브의 예약 실행이 시각을 안 지키기 때문입니다.
# 10분마다 돌라고 적어도 실제 시작은 몇 분에서 몇십 분씩 밀립니다. 그대로 보내면
# 관리 화면에 08:58 이라고 적힌 글의 알림이 09:11 에 옵니다. 시각을 흩어 놓은 뜻이 사라집니다.
#
# 미리 맡는 창(threads-remind.js 의 LEAD_MIN)이 25분이었는데 120분으로 넓혔습니다.
# 밀리는 정도가 몇십 분이 아니었습니다. 2026-08-17 에 세어보니 하루 128번 돌아야 할 것이
# 17번 돌았고 간격이 평균 80분, 최대 214분이었습니다. 25분 창으로는 대부분의 편을 놓칩니다.
#
# 회차마다 텔레그램 답장도 읽습니다. 알림에 답장한 편에 발행 표시를 남기는 일이라,
# 알릴 편이 없는 회차에도 돌아야 합니다.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # 수동으로도 돌려볼 수 있습니다

# 알림 표시와 발행 표시를 저장소에 다시 적어야 하므로 쓰기 권한이 필요합니다.
permissions:
  contents: write

# 여러 실행이 겹치면 같은 편의 알림이 두 번 갑니다.
concurrency:
  group: threads-remind
  cancel-in-progress: false

jobs:
  remind:
    # 저장소 변수 THREADS_ENABLED 를 1 로 두어야 켜집니다.
    # 이게 없으면 10분마다 실패 알림만 쌓입니다(실제로 그렇게 됐습니다).
    if: ${{ vars.THREADS_ENABLED == '1' }}
    runs-on: ubuntu-latest
    # 예약 시각까지 최대 120분을 기다립니다. 거기에 준비와 전송 시간을 더해 넉넉히 잡습니다.
    # LEAD_MIN 을 올리면 여기도 같이 올려야 합니다. 안 그러면 기다리다 잡이 잘리고,
    # 그 편은 ~표시가 안 남아 다음 회차가 다시 맡습니다(늦게라도 나가긴 하지만 정시가 깨집니다).
    timeout-minutes: 135
    # 텔레그램 값이 없으면 무엇을 보낼지 로그로만 찍고 표시를 남기지 않습니다.
    # 그래서 값을 안 넣은 상태로 켜도 큐가 조용히 소모되지는 않습니다.
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 원고를 읽는 데 front-matter 가 필요합니다. 이게 없으면 스크립트가 첫 줄에서 죽습니다.
      - run: npm ci

      - name: 큐 확인 후 알림
        run: node scripts/threads-remind.js

      - name: 표시 커밋
        run: |
          if [ -z "$(git status --porcelain content/threads)" ]; then
            echo "바뀐 것이 없습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/threads
          git commit -m "쓰레드 알림·발행 표시 [skip ci]"
          # 사람이 그사이 커밋했을 수 있으므로 한 번 당겨서 얹습니다.
          git pull --rebase origin main
          git push origin HEAD:main

      # 실패했으면 알립니다.
      # 이게 없으면 조용히 멈춥니다. 알림이 안 오는 것과 알림 자동화가 죽은 것이
      # 폰에서는 똑같아 보이기 때문에, 며칠 지나서야 알게 됩니다.
      # 자동화에서 제일 위험한 건 틀리는 게 아니라 조용히 안 도는 것입니다.
      - name: 실패 알리기
        if: failure()
        run: |
          node scripts/notify.js fail "쓰레드 알림" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
