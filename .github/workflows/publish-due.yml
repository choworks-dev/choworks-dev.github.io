name: 예약 발행

# 글 머리말에 publishAt 이 적혀 있고 draft: true 이면, 그 시각에 draft 를 지우고 푸시합니다.
# 푸시가 배포 워크플로를 깨우므로 사이트에는 몇 분 뒤에 올라옵니다.
#
# 예약 시각 120분 앞부터 회차가 그 글을 맡고, 남은 시간은 스크립트 안에서 기다립니다.
# 깃허브 예약 실행이 10분마다 돌지 않기 때문입니다. 하루치를 세어보니 128번 돌아야 할 것이
# 17번 돌았고 간격이 평균 80분, 최대 214분이었습니다. 좁은 창으로는 시각을 못 맞춥니다.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # 수동으로도 돌려볼 수 있습니다

# draft 줄을 지운 파일을 저장소에 다시 적어야 하므로 쓰기 권한이 필요합니다.
# actions: write 는 아래에서 배포 워크플로를 손으로 깨우는 데 씁니다.
permissions:
  contents: write
  actions: write

# 여러 실행이 겹치면 같은 글을 두 번 커밋하려다 밀칩니다.
concurrency:
  group: publish-due
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 예약 시각까지 최대 120분, 그 뒤 사이트에 뜨는지 확인하며 최대 15분을 더 기다립니다.
    # 거기에 준비와 커밋 시간을 더해 넉넉히 잡습니다.
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 머리말을 읽는 데 front-matter 가 필요합니다.
      - run: npm ci

      - name: 예약된 글 확인 후 공개
        id: publish
        run: node scripts/publish-due.js

      - name: 공개 커밋
        id: commit
        run: |
          if [ -z "$(git status --porcelain content)" ]; then
            echo "바뀐 것이 없습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "예약 발행"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      # 이 푸시는 배포를 못 깨웁니다. 깃허브는 기본 GITHUB_TOKEN 으로 만든 푸시로는
      # 새 워크플로를 시작하지 않습니다. 워크플로가 자기를 무한히 깨우는 것을 막는 규칙입니다.
      # 그래서 [skip ci] 를 안 붙이는 것만으로는 부족하고, 배포를 손으로 깨워야 합니다.
      # workflow_dispatch 는 그 규칙의 예외라 GITHUB_TOKEN 으로도 실행됩니다(PAT 이 필요 없습니다).
      #
      # 2026-08-18 에 글이 정각에 공개되고도 사이트에 안 올라간 이유가 이것입니다.
      # 잡은 성공으로 끝나서 아래 실패 알림도 안 울렸습니다.
      - name: 배포 깨우기
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      # 여기까지는 전부 "실행됐는가" 입니다. 정작 중요한 것은 "떴는가" 입니다.
      # 2026-08-18 에 이 잡은 성공으로 끝났고 커밋도 푸시도 됐지만 글은 사이트에 없었습니다.
      # 그래서 마지막에 진짜 주소를 열어 봅니다. 중간에 무엇이 고장 나든 여기서 걸립니다.
      #
      # 성공해도 알립니다. 문제가 있을 때만 오는 알림은, 알림이 고장난 것과
      # 아무 일도 없는 것을 구별해 주지 못합니다. 예약한 시각에 폰이 조용하면 그게 신호입니다.
      - name: 사이트에 떴는지 확인
        id: verify
        if: steps.commit.outputs.pushed == '1'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/verify-live.js --wait=${{ steps.publish.outputs.published }}

      # 실패했으면 알립니다. 조용히 안 도는 것이 제일 위험합니다.
      # 확인 스텝이 이미 알린 경우는 뺍니다. 같은 일로 두 번 울리면 다음부터 안 보게 됩니다.
      - name: 실패 알리기
        if: failure() && steps.verify.outputs.notified != '1'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/notify.js fail "예약 발행" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
