<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" role="img" aria-label="같은 기록의 값이 몇 년 사이에 뒤집힌 것을 세로로 그린 그림" style="font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <!-- 폰용 세로 배치. 가로 그림을 그대로 줄이면 폰에서 0.38배가 되어 라벨이 5px 로 찍힙니다.
       글자가 안 읽히면 그림이 아니라서 배치를 따로 그렸습니다.
       위에서 아래로 읽으면 한 문장이 됩니다.
       "몇 년 전이면 폐기 대상이던 것이, 시간만 지났을 뿐인데, 1000만 달러가 되었다."
       아이콘 id 에 vfn- 을 붙인 것은 가로 그림과 한 페이지에 같이 들어가기 때문입니다.
       내용은 data-value-flip.svg 와 같습니다. 고칠 때는 둘을 같이 고칩니다. -->
  <style data-standalone>
    svg { --card:#ffffff; --border:#e2e8f0; --text:#16202e; --muted:#5a6b83; --accent:#0f9d76; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --card:#161c26; --border:#232b38; --text:#e6ebf3; --muted:#9aa7bd; --accent:#6ee7b7; --bg:#0e1116; }
    }
  </style>
  <rect data-standalone x="0" y="0" width="360" height="640" fill="var(--bg,#ffffff)"/>

  <defs>
    <marker id="vfn-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#9aa7bd)"/>
    </marker>
    <symbol id="vfn-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="5" width="19" height="14" rx="2.2"/>
      <path d="M3.4 6.6 12 13l8.6-6.4"/>
    </symbol>
    <symbol id="vfn-msg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.6 4.5h14.8a1.6 1.6 0 0 1 1.6 1.6v8a1.6 1.6 0 0 1-1.6 1.6H10.4L6 19.4v-3.7H4.6A1.6 1.6 0 0 1 3 14.1v-8a1.6 1.6 0 0 1 1.6-1.6z"/>
    </symbol>
    <symbol id="vfn-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.4 7.4 3.8 12l4.6 4.6"/>
      <path d="M15.6 7.4 20.2 12l-4.6 4.6"/>
    </symbol>
    <symbol id="vfn-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6.6h16"/>
      <path d="M9.2 6.6V4.4h5.6v2.2"/>
      <path d="M6.4 6.6 7.5 20h9l1.1-13.4"/>
    </symbol>
    <symbol id="vfn-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.6 12.6 12.4 20.8 3.4 11.8V3.4h8.4z"/>
      <circle cx="8.2" cy="8.2" r="1.5"/>
    </symbol>
  </defs>

  <text x="180" y="24" fill="var(--muted,#9aa7bd)" font-size="13" font-weight="600" text-anchor="middle">몇 년 전</text>
  <rect x="30" y="40" width="300" height="150" rx="10" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.5"/>
  <circle cx="180" cy="40" r="15" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.5"/>
  <use href="#vfn-trash" x="171" y="31" width="18" height="18" style="color:var(--muted,#9aa7bd)"/>
  <g style="color:var(--muted,#9aa7bd)">
    <use href="#vfn-mail" x="58" y="71"  width="17" height="17"/>
    <use href="#vfn-msg"  x="58" y="109" width="17" height="17"/>
    <use href="#vfn-code" x="58" y="147" width="17" height="17"/>
  </g>
  <g fill="var(--text,#e6ebf3)" font-size="14" text-anchor="start">
    <text x="86" y="84">사내 이메일 1억 통</text>
    <text x="86" y="122">메신저 대화 5억 건</text>
    <text x="86" y="160">소스코드 3000만 줄</text>
  </g>
  <text x="180" y="226" fill="var(--muted,#9aa7bd)" font-size="20" font-weight="700" text-anchor="middle">폐기 대상</text>
  <text x="180" y="248" fill="var(--muted,#9aa7bd)" font-size="12" text-anchor="middle">보관비만 나가는 짐이었다</text>

  <path d="M180,266 V308" stroke="var(--muted,#9aa7bd)" stroke-width="1.8" fill="none" marker-end="url(#vfn-a)"/>
  <g fill="var(--muted,#9aa7bd)" font-size="12" text-anchor="start">
    <text x="196" y="282">시간이 지났을 뿐</text>
    <text x="196" y="300">데이터는 그대로다</text>
  </g>

  <text x="180" y="344" fill="var(--accent,#6ee7b7)" font-size="13" font-weight="600" text-anchor="middle">2026년 8월</text>
  <rect x="30" y="360" width="300" height="150" rx="10" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/>
  <circle cx="180" cy="360" r="15" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/>
  <use href="#vfn-tag" x="171" y="351" width="18" height="18" style="color:var(--accent,#6ee7b7)"/>
  <g style="color:var(--muted,#9aa7bd)">
    <use href="#vfn-mail" x="58" y="391" width="17" height="17"/>
    <use href="#vfn-msg"  x="58" y="429" width="17" height="17"/>
    <use href="#vfn-code" x="58" y="467" width="17" height="17"/>
  </g>
  <g fill="var(--text,#e6ebf3)" font-size="14" text-anchor="start">
    <text x="86" y="404">사내 이메일 1억 통</text>
    <text x="86" y="442">메신저 대화 5억 건</text>
    <text x="86" y="480">소스코드 3000만 줄</text>
  </g>
  <text x="180" y="546" fill="var(--accent,#6ee7b7)" font-size="20" font-weight="700" text-anchor="middle">1000만 달러</text>
  <text x="180" y="568" fill="var(--muted,#9aa7bd)" font-size="12" text-anchor="middle">구글이 파산 경매에서 낙찰</text>

  <g fill="var(--text,#e6ebf3)" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="180" y="606">바뀐 것은 기록이 아니라,</text>
    <text x="180" y="626">값을 매기는 쪽이었다.</text>
  </g>
</svg>
