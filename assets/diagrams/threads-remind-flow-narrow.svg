<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" width="360" height="620" role="img" aria-label="같은 흐름을 세로로 그린 그림" style="font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <!-- 폰용 세로 배치. 가로 그림을 그대로 줄이면 폰에서 0.38배가 되어 라벨이 4.4px 로 찍힙니다.
       글자가 안 읽히면 그림이 아니라서 배치를 따로 그렸습니다.
       위에서 아래로 읽으면 한 문장이 됩니다.
       "내 저장소에 있는 코드를, 예약 실행기가 깨워서, 깃허브 서버 컴퓨터에서 실행하고,
        텔레그램으로 보내면, 내 폰에 도착한다."
       아이콘은 좌측 변 한가운데. 아이콘 id 에 icn- 을 붙인 것은 가로 그림과 한 페이지에 같이
       들어가기 때문입니다. id 가 겹치면 뒤에 온 쪽이 앞의 것을 가리킵니다.
       내용은 threads-remind-flow.svg 와 같습니다. 고칠 때는 둘을 같이 고칩니다. -->
  <style data-standalone>
    svg { --card:#ffffff; --border:#e2e8f0; --text:#16202e; --muted:#5a6b83; --accent:#0f9d76; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --card:#161c26; --border:#232b38; --text:#e6ebf3; --muted:#9aa7bd; --accent:#6ee7b7; --bg:#0e1116; }
    }
  </style>
  <rect data-standalone x="0" y="0" width="360" height="620" fill="var(--bg,#ffffff)"/>

  <defs>
    <marker id="dgn-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#9aa7bd)"/>
    </marker>
    <marker id="dgn-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#6ee7b7)"/>
    </marker>

    <symbol id="icn-repo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
      <path d="M8.5 3v18"/>
    </symbol>
    <symbol id="icn-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/>
      <path d="M12 7.5V12l3 1.9"/>
    </symbol>
    <symbol id="icn-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="4.5" width="17" height="6" rx="1.6"/>
      <rect x="3.5" y="13.5" width="17" height="6" rx="1.6"/>
      <path d="M7 7.5h.01M7 16.5h.01"/>
    </symbol>
    <symbol id="icn-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.5 2.5 15 21.5l-3.8-8.7-8.7-3.8z"/>
      <path d="M21.5 2.5 11.2 12.8"/>
    </symbol>
    <symbol id="icn-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6.5" y="2.5" width="11" height="19" rx="2.6"/>
      <path d="M10.5 18.4h3"/>
    </symbol>
  </defs>

  <g fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.5">
    <rect x="84" y="6"   width="246" height="76" rx="10"/>
    <rect x="84" y="256" width="246" height="76" rx="10"/>
    <rect x="84" y="376" width="246" height="76" rx="10"/>
    <rect x="84" y="496" width="246" height="76" rx="10"/>
  </g>
  <rect x="84" y="126" width="246" height="86" rx="10" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/>

  <!-- 아이콘은 좌측 변 한가운데에 배지로 얹습니다. -->
  <g fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.5">
    <circle cx="84" cy="44"  r="15"/>
    <circle cx="84" cy="294" r="15"/>
    <circle cx="84" cy="414" r="15"/>
    <circle cx="84" cy="534" r="15"/>
  </g>
  <circle cx="84" cy="169" r="15" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/>

  <g style="color:var(--muted,#9aa7bd)">
    <use href="#icn-repo"   x="75" y="35"  width="18" height="18"/>
    <use href="#icn-server" x="75" y="285" width="18" height="18"/>
    <use href="#icn-send"   x="75" y="405" width="18" height="18"/>
    <use href="#icn-phone"  x="75" y="525" width="18" height="18"/>
  </g>
  <use href="#icn-clock" x="75" y="160" width="18" height="18" style="color:var(--accent,#6ee7b7)"/>

  <g fill="var(--text,#e6ebf3)" font-size="14" font-weight="600" text-anchor="middle">
    <text x="215" y="36">내 저장소</text>
    <text x="215" y="156">깃허브 예약 실행기</text>
    <text x="215" y="286">깃허브 서버 컴퓨터</text>
    <text x="215" y="406">텔레그램</text>
    <text x="215" y="526">내 폰</text>
  </g>
  <g fill="var(--muted,#9aa7bd)" font-size="11" text-anchor="middle">
    <text x="215" y="56">원고 파일과 코드</text>
    <text x="215" y="306">코드가 여기서 실행됩니다</text>
    <text x="215" y="426">메시지를 24시간 보관</text>
    <text x="215" y="546">복사해서 직접 올립니다</text>
  </g>
  <text x="215" y="176" fill="var(--accent,#6ee7b7)" font-size="11" font-weight="600" text-anchor="middle">여기가 제때 안 깨어납니다</text>
  <g fill="var(--muted,#9aa7bd)" font-size="10" text-anchor="middle" opacity="0.85">
    <text x="215" y="74">우리 것</text>
    <text x="215" y="196">깃허브 것</text>
    <text x="215" y="324">깃허브 것</text>
    <text x="215" y="444">외부 서비스</text>
    <text x="215" y="564">사람</text>
  </g>

  <g stroke="var(--muted,#9aa7bd)" stroke-width="1.8" fill="none" marker-end="url(#dgn-a)">
    <path d="M215,86 V122"/>
    <path d="M215,336 V372"/>
    <path d="M215,456 V492"/>
  </g>
  <path d="M215,216 V252" stroke="var(--accent,#6ee7b7)" stroke-width="2" fill="none" marker-end="url(#dgn-b)"/>

  <path d="M84,316 H44 V24 H74" stroke="var(--muted,#9aa7bd)" stroke-width="1.8" fill="none" marker-end="url(#dgn-a)"/>
  <text transform="rotate(-90 24 250)" x="24" y="250" fill="var(--muted,#9aa7bd)" font-size="10" text-anchor="middle">표시를 다시 적습니다</text>

  <g fill="var(--muted,#9aa7bd)" font-size="10.5" text-anchor="start">
    <text x="223" y="108">여기 있는 코드를</text>
    <text x="223" y="358">원고 전송</text>
    <text x="223" y="478">알림 도착</text>
  </g>
  <text x="223" y="238" fill="var(--accent,#6ee7b7)" font-size="10.5" text-anchor="start">깨워서</text>
</svg>
