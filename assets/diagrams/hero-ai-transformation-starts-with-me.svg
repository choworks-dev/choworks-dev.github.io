<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="hero-me-w-t hero-me-w-d" style="font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <title id="hero-me-w-t">한계선이 바깥으로 밀려났다</title>
  <desc id="hero-me-w-d">가운데가 나이고 점선이 예전 한계선입니다. 바깥의 굵은 원이 지금이며, 위에서 내려오는 점선은 머리로 들어오는 것입니다.</desc>
  <!-- scripts/make-hero.js 가 만든 파일입니다. 손으로 고치지 마세요. 다음 실행 때 덮어씁니다.
       고칠 곳은 scripts/hero-specs.js 의 "me" 항목입니다.
       넓은 화면용입니다.
       짝은 narrow 파일이고 둘 다 같은 항목에서 나옵니다.
       data-standalone 이 붙은 것은 이 파일을 그냥 열어봤을 때만 씁니다. 펴 넣을 때 빠지고,
       색은 사이트의 --card, --accent 를 그대로 받아 테마 토글을 따라옵니다. -->
  <style data-standalone>
    svg { --card:#ffffff; --bg-soft:#f5f7fa; --border:#e2e8f0; --text:#16202e; --muted:#5a6b83; --accent:#0f9d76; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --card:#161c26; --bg-soft:#141922; --border:#232b38; --text:#e6ebf3; --muted:#9aa7bd; --accent:#6ee7b7; --bg:#0e1116; }
    }
  </style>
  <rect data-standalone x="0" y="0" width="900" height="300" fill="var(--bg,#ffffff)"/>
  <defs>
    <linearGradient id="hero-me-w-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="0.55" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="1" stop-color="var(--bg,#0e1116)"/>
    </linearGradient>
    <radialGradient id="hero-me-w-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="var(--accent,#6ee7b7)" stop-opacity="0.20"/>
      <stop offset="1" stop-color="var(--accent,#6ee7b7)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-me-w-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="var(--muted,#9aa7bd)" opacity="0.16"/>
    </pattern>
    <clipPath id="hero-me-w-clip"><rect x="0" y="0" width="900" height="300" rx="14"/></clipPath>
    <marker id="hero-me-w-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#9aa7bd)"/>
    </marker>
    <marker id="hero-me-w-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#6ee7b7)"/>
    </marker>
  </defs>
  <g clip-path="url(#hero-me-w-clip)">
    <rect x="0" y="0" width="900" height="300" fill="url(#hero-me-w-panel)"/>
    <rect x="0" y="0" width="900" height="300" fill="url(#hero-me-w-dots)"/>
    <ellipse cx="450" cy="150" rx="320" ry="150" fill="url(#hero-me-w-glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="14" fill="none" stroke="var(--border,#232b38)" stroke-width="1.5"/>
  <path d="M416,4 V100" fill="none" stroke="var(--accent,#6ee7b7)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 8" opacity="0.4"/><path d="M450,4 V100" fill="none" stroke="var(--accent,#6ee7b7)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 8" opacity="0.8"/><path d="M484,4 V100" fill="none" stroke="var(--accent,#6ee7b7)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 8" opacity="0.4"/><circle cx="450" cy="146" r="108" fill="none" stroke="var(--accent,#6ee7b7)" stroke-width="2" opacity="0.9"/><circle cx="450" cy="146" r="66" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="1.6" stroke-dasharray="4 7" opacity="0.65"/><path d="M503.74,199.74 L520.71,216.71" fill="none" stroke="var(--accent,#6ee7b7)" stroke-width="1.8" stroke-linecap="round" opacity="0.8" marker-end="url(#hero-me-w-aa)"/><path d="M396.26,199.74 L379.29,216.71" fill="none" stroke="var(--accent,#6ee7b7)" stroke-width="1.8" stroke-linecap="round" opacity="0.8" marker-end="url(#hero-me-w-aa)"/><path d="M503.74,92.26 L520.71,75.29" fill="none" stroke="var(--accent,#6ee7b7)" stroke-width="1.8" stroke-linecap="round" opacity="0.8" marker-end="url(#hero-me-w-aa)"/><path d="M396.26,92.26 L379.29,75.29" fill="none" stroke="var(--accent,#6ee7b7)" stroke-width="1.8" stroke-linecap="round" opacity="0.8" marker-end="url(#hero-me-w-aa)"/><g transform="translate(414,110) scale(0.9)"><circle cx="40" cy="24" r="17" fill="var(--card,#161c26)" stroke="var(--muted,#9aa7bd)" stroke-width="2.2"/><path d="M6,86 C6,58 22,46 40,46 C58,46 74,58 74,86 Z" fill="var(--card,#161c26)" stroke="var(--muted,#9aa7bd)" stroke-width="2.2" stroke-linejoin="round"/></g>
  <rect x="745" y="24" width="119" height="26" rx="13" fill="none" stroke="var(--border,#232b38)" stroke-width="1.4"/>
  <text x="804.5" y="41.5" fill="var(--muted,#9aa7bd)" font-size="12" font-weight="600" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0.08em">The Operator</text>
  <text x="450" y="277" fill="var(--muted,#9aa7bd)" font-size="12.5" text-anchor="middle" style="letter-spacing:0.06em">바뀐 것은 업무가 아니라 · 일하는 사람 쪽이었다</text>
</svg>
