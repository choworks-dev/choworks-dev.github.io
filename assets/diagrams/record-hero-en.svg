<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="rhTitleEn rhDescEn" style="font-family:system-ui,'Segoe UI',sans-serif">
  <title id="rhTitleEn">The moment a pile of records becomes an asset</title>
  <desc id="rhDescEn">Older records lie faded at the bottom and grow sharper toward the top. A price tag hangs off the topmost one. Records nobody deleted have started to carry a price.</desc>

  <!-- Cover art for the top of the post. It sets a tone rather than explaining anything,
       so there are no numbers and no proper nouns. The body and data-value-flip-en.svg do that job.
       Put a price in the cover and the cover becomes the summary, which gives the reader
       one less reason to read on.

       Elements marked data-standalone are only for viewing this file on its own; they are
       stripped when the SVG is inlined so colors follow the site variables and the theme toggle works.
       Ids are prefixed rhw- because the wide and narrow versions land on the same page. -->
  <style data-standalone>
    svg { --card:#ffffff; --bg-soft:#f5f7fa; --border:#e2e8f0; --text:#16202e; --muted:#5a6b83; --accent:#0f9d76; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --card:#161c26; --bg-soft:#141922; --border:#232b38; --text:#e6ebf3; --muted:#9aa7bd; --accent:#6ee7b7; --bg:#0e1116; }
    }
  </style>
  <rect data-standalone x="0" y="0" width="900" height="300" fill="var(--bg,#ffffff)"/>

  <defs>
    <linearGradient id="rhw-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="var(--bg-soft,#141922)"/>
      <stop offset="0.55" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="1"   stop-color="var(--bg,#0e1116)"/>
    </linearGradient>
    <radialGradient id="rhw-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="var(--accent,#6ee7b7)" stop-opacity="0.20"/>
      <stop offset="1" stop-color="var(--accent,#6ee7b7)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rhw-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="var(--muted,#9aa7bd)" opacity="0.16"/>
    </pattern>
    <clipPath id="rhw-clip"><rect x="0" y="0" width="900" height="300" rx="14"/></clipPath>
    <symbol id="rhw-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.6 12.6 12.4 20.8 3.4 11.8V3.4h8.4z"/>
      <circle cx="8.2" cy="8.2" r="1.5"/>
    </symbol>
  </defs>

  <g clip-path="url(#rhw-clip)">
    <rect x="0" y="0" width="900" height="300" fill="url(#rhw-panel)"/>
    <rect x="0" y="0" width="900" height="300" fill="url(#rhw-dots)"/>
    <ellipse cx="486" cy="69" rx="300" ry="150" fill="url(#rhw-glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="14" fill="none" stroke="var(--border,#232b38)" stroke-width="1.5"/>

