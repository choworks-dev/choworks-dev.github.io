<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="hero-notfound-w-t hero-notfound-w-d" style="font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <title id="hero-notfound-w-t">주소마다 색인 상태가 다르다</title>
  <desc id="hero-notfound-w-d">돋보기 옆에 주소가 줄지어 있고, 동그라미가 찬 것은 색인된 주소이며 빈 것은 아직 안 된 주소입니다.</desc>
  <!-- scripts/make-hero.js 가 만든 파일입니다. 손으로 고치지 마세요. 다음 실행 때 덮어씁니다.
       고칠 곳은 scripts/hero-specs.js 의 "notfound" 항목입니다.
       넓은 화면용입니다.
       짝은 narrow 파일이고 둘 다 같은 항목에서 나옵니다.
       data-standalone 이 붙은 것은 이 파일을 그냥 열어봤을 때만 씁니다. 펴 넣을 때 빠지고,
       색은 사이트의 --card, --accent 를 그대로 받아 테마 토글을 따라옵니다. -->
  <style data-standalone>
    svg { --card:#ffffff; --bg-soft:#f5f7fa; --border:#e2e8f0; --text:#16202e; --muted:#5a6b83; --accent:#0f9d76; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --card:#161c26; --bg-soft:#141922; --border:#232b38; --text:#e6ebf3; --muted:#9aa7bd; --accent:#6ee7b7; --bg:#0e1116; }
    }
  </style>
  <rect data-standalone x="0" y="0" width="900" height="300" fill="var(--bg,#ffffff)"/>
  <defs>
    <linearGradient id="hero-notfound-w-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="0.55" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="1" stop-color="var(--bg,#0e1116)"/>
    </linearGradient>
    <radialGradient id="hero-notfound-w-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="var(--accent,#6ee7b7)" stop-opacity="0.20"/>
      <stop offset="1" stop-color="var(--accent,#6ee7b7)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-notfound-w-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="var(--muted,#9aa7bd)" opacity="0.16"/>
    </pattern>
    <clipPath id="hero-notfound-w-clip"><rect x="0" y="0" width="900" height="300" rx="14"/></clipPath>
    <marker id="hero-notfound-w-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#9aa7bd)"/>
    </marker>
    <marker id="hero-notfound-w-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#6ee7b7)"/>
    </marker>
  </defs>
  <g clip-path="url(#hero-notfound-w-clip)">
    <rect x="0" y="0" width="900" height="300" fill="url(#hero-notfound-w-panel)"/>
    <rect x="0" y="0" width="900" height="300" fill="url(#hero-notfound-w-dots)"/>
    <ellipse cx="400" cy="150" rx="320" ry="150" fill="url(#hero-notfound-w-glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="14" fill="none" stroke="var(--border,#232b38)" stroke-width="1.5"/>
  <g transform="translate(126,78) scale(1.05)"><circle cx="56" cy="56" r="42" fill="var(--card,#161c26)" stroke="var(--muted,#9aa7bd)" stroke-width="2.4"/><circle cx="56" cy="56" r="33" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="1.3" opacity="0.4"/><path d="M86,86 L120,120" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="4" stroke-linecap="round"/></g><circle cx="360" cy="74" r="6" fill="var(--accent,#6ee7b7)"/><rect x="380" y="71.5" width="220" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.55"/><circle cx="360" cy="106" r="6" fill="var(--accent,#6ee7b7)"/><rect x="380" y="103.5" width="176" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.55"/><circle cx="360" cy="138" r="6" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="1.6" opacity="0.55"/><rect x="380" y="135.5" width="246" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.25"/><circle cx="360" cy="170" r="6" fill="var(--accent,#6ee7b7)"/><rect x="380" y="167.5" width="198" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.55"/><circle cx="360" cy="202" r="6" fill="var(--accent,#6ee7b7)"/><rect x="380" y="199.5" width="160" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.55"/><circle cx="360" cy="234" r="6" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="1.6" opacity="0.55"/><rect x="380" y="231.5" width="232" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.25"/>
  <rect x="775" y="24" width="89" height="26" rx="13" fill="none" stroke="var(--border,#232b38)" stroke-width="1.4"/>
  <text x="819.5" y="41.5" fill="var(--muted,#9aa7bd)" font-size="12" font-weight="600" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0.08em">Indexed?</text>
  <text x="450" y="277" fill="var(--muted,#9aa7bd)" font-size="12.5" text-anchor="middle" style="letter-spacing:0.06em">안 나온다는 말에 · 뜻이 두 가지 있다</text>
</svg>
