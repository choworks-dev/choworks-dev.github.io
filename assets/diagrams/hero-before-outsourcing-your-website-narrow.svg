<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320" role="img" aria-label="견적서 한 장에서 두 갈래가 갈려 나갑니다. 위는 직접 할 수 있는 일이고 아래는 사람에게 맡길 일입니다." style="font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <!-- scripts/make-hero.js 가 만든 파일입니다. 손으로 고치지 마세요. 다음 실행 때 덮어씁니다.
       고칠 곳은 scripts/hero-specs.js 의 "quotepaper" 항목입니다.
       폰용 세로 배치입니다. 가로를 그대로 줄이면 아래 한 줄이 5px 로 찍힙니다.
       짝은 가로 파일이고 둘 다 같은 항목에서 나옵니다.
       data-standalone 이 붙은 것은 이 파일을 그냥 열어봤을 때만 씁니다. 펴 넣을 때 빠지고,
       색은 사이트의 --card, --accent 를 그대로 받아 테마 토글을 따라옵니다. -->
  <style data-standalone>
    svg { --card:#ffffff; --bg-soft:#f5f7fa; --border:#e2e8f0; --text:#16202e; --muted:#5a6b83; --accent:#0f9d76; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --card:#161c26; --bg-soft:#141922; --border:#232b38; --text:#e6ebf3; --muted:#9aa7bd; --accent:#6ee7b7; --bg:#0e1116; }
    }
  </style>
  <rect data-standalone x="0" y="0" width="360" height="320" fill="var(--bg,#ffffff)"/>
  <defs>
    <linearGradient id="hero-quotepaper-n-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="0.55" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="1" stop-color="var(--bg,#0e1116)"/>
    </linearGradient>
    <radialGradient id="hero-quotepaper-n-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="var(--accent,#6ee7b7)" stop-opacity="0.20"/>
      <stop offset="1" stop-color="var(--accent,#6ee7b7)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-quotepaper-n-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="var(--muted,#9aa7bd)" opacity="0.16"/>
    </pattern>
    <clipPath id="hero-quotepaper-n-clip"><rect x="0" y="0" width="360" height="320" rx="14"/></clipPath>
    <marker id="hero-quotepaper-n-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#9aa7bd)"/>
    </marker>
    <marker id="hero-quotepaper-n-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#6ee7b7)"/>
    </marker>
  </defs>
  <g clip-path="url(#hero-quotepaper-n-clip)">
    <rect x="0" y="0" width="360" height="320" fill="url(#hero-quotepaper-n-panel)"/>
    <rect x="0" y="0" width="360" height="320" fill="url(#hero-quotepaper-n-dots)"/>
    <ellipse cx="180" cy="150" rx="190" ry="150" fill="url(#hero-quotepaper-n-glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="358.5" height="318.5" rx="14" fill="none" stroke="var(--border,#232b38)" stroke-width="1.5"/>
  <g transform="translate(112,18) scale(0.56)"><path d="M4,4 H158 L186,32 V236 H4 Z" fill="var(--card,#161c26)" stroke="var(--muted,#9aa7bd)" stroke-width="2" stroke-linejoin="round"/><path d="M158,4 V32 H186" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/><circle cx="30" cy="72" r="3.2" fill="var(--muted,#9aa7bd)" opacity="0.7"/><rect x="44" y="70" width="72" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><rect x="130" y="70" width="40" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><circle cx="30" cy="102" r="3.2" fill="var(--muted,#9aa7bd)" opacity="0.7"/><rect x="44" y="100" width="58" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><rect x="130" y="100" width="40" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><circle cx="30" cy="132" r="3.2" fill="var(--muted,#9aa7bd)" opacity="0.7"/><rect x="44" y="130" width="84" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><rect x="130" y="130" width="40" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><circle cx="30" cy="162" r="3.2" fill="var(--muted,#9aa7bd)" opacity="0.7"/><rect x="44" y="160" width="64" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><rect x="130" y="160" width="40" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><path d="M28,188 H172" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/><rect x="108" y="200" width="62" height="5" rx="2.5" fill="var(--accent,#6ee7b7)" opacity="0.9"/></g><path d="M180,158 V186" fill="none" stroke="var(--accent,#6ee7b7)" stroke-width="2" stroke-linecap="round" marker-end="url(#hero-quotepaper-n-aa)"/><rect x="38" y="194" width="284" height="40" rx="6" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/><circle cx="50" cy="214" r="3.3" fill="var(--muted,#9aa7bd)" opacity="0.9"/><rect x="63" y="208.4" width="146.32" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><rect x="63" y="216.4" width="89.68" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><g opacity="0.5"><rect x="38" y="242" width="284" height="34" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="50" cy="259" r="3.3" fill="var(--muted,#9aa7bd)" opacity="0.9"/><rect x="63" y="253.4" width="129.8" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><rect x="63" y="261.4" width="165.2" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/></g>
  <rect x="223" y="22" width="115" height="24" rx="12" fill="none" stroke="var(--border,#232b38)" stroke-width="1.4"/>
  <text x="280.5" y="38.5" fill="var(--muted,#9aa7bd)" font-size="11.5" font-weight="600" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0.08em">Buy vs Build</text>
  <g fill="var(--muted,#9aa7bd)" font-size="12" text-anchor="middle" style="letter-spacing:0.05em"><text x="180" y="280">옮기는 일과 만드는 일</text><text x="180" y="299">값이 붙는 자리가 다르다</text></g>
</svg>
