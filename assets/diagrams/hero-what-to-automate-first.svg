<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="hero-steps-w-t hero-steps-w-d" style="font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <title id="hero-steps-w-t">첫 칸만 또렷한 계단</title>
  <desc id="hero-steps-w-d">계단처럼 놓인 칸들 가운데 왼쪽 아래 첫 칸만 또렷합니다. 무엇을 하느냐보다 어디서부터냐가 먼저입니다.</desc>
  <!-- scripts/make-hero.js 가 만든 파일입니다. 손으로 고치지 마세요. 다음 실행 때 덮어씁니다.
       고칠 곳은 scripts/hero-specs.js 의 "steps" 항목입니다.
       넓은 화면용입니다.
       짝은 narrow 파일이고 둘 다 같은 항목에서 나옵니다.
       data-standalone 이 붙은 것은 이 파일을 그냥 열어봤을 때만 씁니다. 펴 넣을 때 빠지고,
       색은 사이트의 --card, --accent 를 그대로 받아 테마 토글을 따라옵니다. -->
  <style data-standalone>
    svg { --card:#ffffff; --bg-soft:#f5f7fa; --border:#e2e8f0; --text:#16202e; --muted:#5a6b83; --accent:#0f9d76; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --card:#161c26; --bg-soft:#141922; --border:#232b38; --text:#e6ebf3; --muted:#9aa7bd; --accent:#6ee7b7; --bg:#0e1116; }
    }
  </style>
  <rect data-standalone x="0" y="0" width="900" height="300" fill="var(--bg,#ffffff)"/>
  <defs>
    <linearGradient id="hero-steps-w-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="0.55" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="1" stop-color="var(--bg,#0e1116)"/>
    </linearGradient>
    <radialGradient id="hero-steps-w-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="var(--accent,#6ee7b7)" stop-opacity="0.20"/>
      <stop offset="1" stop-color="var(--accent,#6ee7b7)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-steps-w-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="var(--muted,#9aa7bd)" opacity="0.16"/>
    </pattern>
    <clipPath id="hero-steps-w-clip"><rect x="0" y="0" width="900" height="300" rx="14"/></clipPath>
    <marker id="hero-steps-w-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#9aa7bd)"/>
    </marker>
    <marker id="hero-steps-w-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#6ee7b7)"/>
    </marker>
  </defs>
  <g clip-path="url(#hero-steps-w-clip)">
    <rect x="0" y="0" width="900" height="300" fill="url(#hero-steps-w-panel)"/>
    <rect x="0" y="0" width="900" height="300" fill="url(#hero-steps-w-dots)"/>
    <ellipse class="hero-glow" cx="200" cy="210" rx="320" ry="150" fill="url(#hero-steps-w-glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="14" fill="none" stroke="var(--border,#232b38)" stroke-width="1.5"/>
  <g opacity="0.44"><rect x="672" y="62" width="118" height="42" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="690" cy="83" r="3.4" fill="var(--muted,#9aa7bd)"/><rect x="704" y="81" width="66" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.5"/></g><g opacity="0.54"><rect x="534" y="100" width="118" height="42" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="552" cy="121" r="3.4" fill="var(--muted,#9aa7bd)"/><rect x="566" y="119" width="66" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.5"/></g><g opacity="0.64"><rect x="396" y="138" width="118" height="42" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="414" cy="159" r="3.4" fill="var(--muted,#9aa7bd)"/><rect x="428" y="157" width="66" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.5"/></g><g opacity="0.74"><rect x="258" y="176" width="118" height="42" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="276" cy="197" r="3.4" fill="var(--muted,#9aa7bd)"/><rect x="290" y="195" width="66" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.5"/></g><g opacity="1"><rect x="120" y="214" width="118" height="42" rx="6" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/><circle cx="138" cy="235" r="3.4" fill="var(--accent,#6ee7b7)"/><rect x="152" y="233" width="66" height="3.6" rx="1.8" fill="var(--accent,#6ee7b7)" opacity="0.8"/></g>
  <rect x="760" y="24" width="104" height="26" rx="13" fill="none" stroke="var(--border,#232b38)" stroke-width="1.4"/>
  <text x="812" y="41.5" fill="var(--muted,#9aa7bd)" font-size="12" font-weight="600" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0.08em">Start Here</text>
  <text x="450" y="277" fill="var(--muted,#9aa7bd)" font-size="12.5" text-anchor="middle" style="letter-spacing:0.06em">무엇을 없앨까보다 · 어디서부터가 먼저다</text>
</svg>
