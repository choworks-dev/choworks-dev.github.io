<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320" role="img" aria-label="오래된 기록일수록 아래에 흐릿하게 깔려 있고 위로 갈수록 또렷해집니다. 맨 위 한 장에 값표가 붙어 있습니다." style="font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <!-- scripts/make-hero.js 가 만든 파일입니다. 손으로 고치지 마세요. 다음 실행 때 덮어씁니다.
       고칠 곳은 scripts/hero-specs.js 의 "record" 항목입니다.
       폰용 세로 배치입니다. 가로를 그대로 줄이면 아래 한 줄이 5px 로 찍힙니다.
       짝은 가로 파일이고 둘 다 같은 항목에서 나옵니다.
       data-standalone 이 붙은 것은 이 파일을 그냥 열어봤을 때만 씁니다. 펴 넣을 때 빠지고,
       색은 사이트의 --card, --accent 를 그대로 받아 테마 토글을 따라옵니다. -->
  <style data-standalone>
    svg { --card:#ffffff; --bg-soft:#f5f7fa; --border:#e2e8f0; --text:#16202e; --muted:#5a6b83; --accent:#0f9d76; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --card:#161c26; --bg-soft:#141922; --border:#232b38; --text:#e6ebf3; --muted:#9aa7bd; --accent:#6ee7b7; --bg:#0e1116; }
    }
  </style>
  <rect data-standalone x="0" y="0" width="360" height="320" fill="var(--bg,#ffffff)"/>
  <defs>
    <linearGradient id="hero-record-n-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="0.55" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="1" stop-color="var(--bg,#0e1116)"/>
    </linearGradient>
    <radialGradient id="hero-record-n-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="var(--accent,#6ee7b7)" stop-opacity="0.20"/>
      <stop offset="1" stop-color="var(--accent,#6ee7b7)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-record-n-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="var(--muted,#9aa7bd)" opacity="0.16"/>
    </pattern>
    <clipPath id="hero-record-n-clip"><rect x="0" y="0" width="360" height="320" rx="14"/></clipPath>
    <marker id="hero-record-n-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#9aa7bd)"/>
    </marker>
    <marker id="hero-record-n-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#6ee7b7)"/>
    </marker>
  </defs>
  <g clip-path="url(#hero-record-n-clip)">
    <rect x="0" y="0" width="360" height="320" fill="url(#hero-record-n-panel)"/>
    <rect x="0" y="0" width="360" height="320" fill="url(#hero-record-n-dots)"/>
    <ellipse cx="200" cy="108" rx="180" ry="130" fill="url(#hero-record-n-glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="358.5" height="318.5" rx="14" fill="none" stroke="var(--border,#232b38)" stroke-width="1.5"/>
  <defs><symbol id="hero-record-n-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.6 12.4 20.8 3.4 11.8V3.4h8.4z"/><circle cx="8.2" cy="8.2" r="1.5"/></symbol></defs><g opacity="0.4"><rect x="62" y="228" width="210" height="24" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="74" cy="240" r="3.3" fill="var(--muted,#9aa7bd)" opacity="0.9"/><rect x="87" y="234.4" width="101.68" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><rect x="87" y="242.4" width="62.32" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/></g><g opacity="0.5"><rect x="68" y="206" width="210" height="24" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="80" cy="218" r="3.3" fill="var(--muted,#9aa7bd)" opacity="0.9"/><rect x="93" y="212.4" width="78.72" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><rect x="93" y="220.4" width="98.4" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/></g><g opacity="0.6"><rect x="74" y="184" width="210" height="24" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="86" cy="196" r="3.3" fill="var(--muted,#9aa7bd)" opacity="0.9"/><rect x="99" y="190.4" width="114.8" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><rect x="99" y="198.4" width="72.16" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/></g><g opacity="0.7"><rect x="80" y="162" width="210" height="24" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="92" cy="174" r="3.3" fill="var(--muted,#9aa7bd)" opacity="0.9"/><rect x="105" y="168.4" width="90.2" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><rect x="105" y="176.4" width="114.8" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/></g><g opacity="0.8"><rect x="86" y="140" width="210" height="24" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="98" cy="152" r="3.3" fill="var(--muted,#9aa7bd)" opacity="0.9"/><rect x="111" y="146.4" width="108.24" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><rect x="111" y="154.4" width="59.04" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/></g><g opacity="0.9"><rect x="92" y="118" width="210" height="24" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="104" cy="130" r="3.3" fill="var(--muted,#9aa7bd)" opacity="0.9"/><rect x="117" y="124.4" width="68.88" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><rect x="117" y="132.4" width="95.12" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/></g><rect x="98" y="96" width="210" height="24" rx="6" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/><circle cx="114" cy="108" r="3.3" fill="var(--accent,#6ee7b7)"/><rect x="128" y="102.4" width="102.9" height="3.6" rx="1.8" fill="var(--accent,#6ee7b7)" opacity="0.75"/><rect x="128" y="110.4" width="75.6" height="3.6" rx="1.8" fill="var(--accent,#6ee7b7)" opacity="0.75"/><circle cx="308" cy="96" r="14" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/><use href="#hero-record-n-tag" x="299.74" y="87.74" width="16.52" height="16.52" style="color:var(--accent,#6ee7b7)"/>
  <rect x="216" y="22" width="122" height="24" rx="12" fill="none" stroke="var(--border,#232b38)" stroke-width="1.4"/>
  <text x="277" y="38.5" fill="var(--muted,#9aa7bd)" font-size="11.5" font-weight="600" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0.08em">Data as Asset</text>
  <g fill="var(--muted,#9aa7bd)" font-size="12" text-anchor="middle" style="letter-spacing:0.05em"><text x="180" y="280">이메일 · 메신저 · 소스코드</text><text x="180" y="299">그리고 지우지 않은 시간</text></g>
</svg>
