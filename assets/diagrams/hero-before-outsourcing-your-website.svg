<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="hero-quotepaper-w-t hero-quotepaper-w-d" style="font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <title id="hero-quotepaper-w-t">견적서에서 값이 갈리는 자리</title>
  <desc id="hero-quotepaper-w-d">견적서 한 장에서 두 갈래가 갈려 나갑니다. 위는 값이 내려간 자리이고 아래는 그대로인 자리입니다.</desc>
  <!-- scripts/make-hero.js 가 만든 파일입니다. 손으로 고치지 마세요. 다음 실행 때 덮어씁니다.
       고칠 곳은 scripts/hero-specs.js 의 "quotepaper" 항목입니다.
       넓은 화면용입니다.
       짝은 narrow 파일이고 둘 다 같은 항목에서 나옵니다.
       data-standalone 이 붙은 것은 이 파일을 그냥 열어봤을 때만 씁니다. 펴 넣을 때 빠지고,
       색은 사이트의 --card, --accent 를 그대로 받아 테마 토글을 따라옵니다. -->
  <style data-standalone>
    svg { --card:#ffffff; --bg-soft:#f5f7fa; --border:#e2e8f0; --text:#16202e; --muted:#5a6b83; --accent:#0f9d76; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --card:#161c26; --bg-soft:#141922; --border:#232b38; --text:#e6ebf3; --muted:#9aa7bd; --accent:#6ee7b7; --bg:#0e1116; }
    }
  </style>
  <rect data-standalone x="0" y="0" width="900" height="300" fill="var(--bg,#ffffff)"/>
  <defs>
    <linearGradient id="hero-quotepaper-w-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="0.55" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="1" stop-color="var(--bg,#0e1116)"/>
    </linearGradient>
    <radialGradient id="hero-quotepaper-w-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="var(--accent,#6ee7b7)" stop-opacity="0.20"/>
      <stop offset="1" stop-color="var(--accent,#6ee7b7)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-quotepaper-w-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="var(--muted,#9aa7bd)" opacity="0.16"/>
    </pattern>
    <clipPath id="hero-quotepaper-w-clip"><rect x="0" y="0" width="900" height="300" rx="14"/></clipPath>
    <marker id="hero-quotepaper-w-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#9aa7bd)"/>
    </marker>
    <marker id="hero-quotepaper-w-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#6ee7b7)"/>
    </marker>
  </defs>
  <g clip-path="url(#hero-quotepaper-w-clip)">
    <rect x="0" y="0" width="900" height="300" fill="url(#hero-quotepaper-w-panel)"/>
    <rect x="0" y="0" width="900" height="300" fill="url(#hero-quotepaper-w-dots)"/>
    <ellipse cx="420" cy="140" rx="320" ry="150" fill="url(#hero-quotepaper-w-glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="14" fill="none" stroke="var(--border,#232b38)" stroke-width="1.5"/>
  <g transform="translate(96,34) scale(0.92)"><path d="M4,4 H158 L186,32 V236 H4 Z" fill="var(--card,#161c26)" stroke="var(--muted,#9aa7bd)" stroke-width="2" stroke-linejoin="round"/><path d="M158,4 V32 H186" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/><circle cx="30" cy="72" r="3.2" fill="var(--muted,#9aa7bd)" opacity="0.7"/><rect x="44" y="70" width="72" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><rect x="130" y="70" width="40" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><circle cx="30" cy="102" r="3.2" fill="var(--muted,#9aa7bd)" opacity="0.7"/><rect x="44" y="100" width="58" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><rect x="130" y="100" width="40" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><circle cx="30" cy="132" r="3.2" fill="var(--muted,#9aa7bd)" opacity="0.7"/><rect x="44" y="130" width="84" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><rect x="130" y="130" width="40" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><circle cx="30" cy="162" r="3.2" fill="var(--muted,#9aa7bd)" opacity="0.7"/><rect x="44" y="160" width="64" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><rect x="130" y="160" width="40" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.45"/><path d="M28,188 H172" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/><rect x="108" y="200" width="62" height="5" rx="2.5" fill="var(--accent,#6ee7b7)" opacity="0.9"/></g><path d="M290,110 C350,110 360,104 400,104" fill="none" stroke="var(--accent,#6ee7b7)" stroke-width="2" stroke-linecap="round" marker-end="url(#hero-quotepaper-w-aa)"/><path d="M290,166 C350,166 360,186 400,186" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="1.8" stroke-linecap="round" opacity="0.55" marker-end="url(#hero-quotepaper-w-am)"/><rect x="410" y="78" width="330" height="54" rx="6" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/><circle cx="422" cy="105" r="3.3" fill="var(--muted,#9aa7bd)" opacity="0.9"/><rect x="435" y="99.4" width="173.6" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><rect x="435" y="107.4" width="106.4" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><g opacity="0.5"><rect x="410" y="160" width="330" height="54" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="422" cy="187" r="3.3" fill="var(--muted,#9aa7bd)" opacity="0.9"/><rect x="435" y="181.4" width="154" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><rect x="435" y="189.4" width="196" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/></g>
  <rect x="723" y="24" width="141" height="26" rx="13" fill="none" stroke="var(--border,#232b38)" stroke-width="1.4"/>
  <text x="793.5" y="41.5" fill="var(--muted,#9aa7bd)" font-size="12" font-weight="600" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0.08em">Build vs Decide</text>
  <text x="450" y="277" fill="var(--muted,#9aa7bd)" font-size="12.5" text-anchor="middle" style="letter-spacing:0.06em">만드는 값은 내려갔다 · 정하는 값은 그대로다</text>
</svg>
