    <rect x="0" y="0" width="900" height="300" fill="url(#hero-quotepaper-w-dots)"/>
    <ellipse class="hero-glow" cx="420" cy="140" rx="320" ry="150" fill="url(#hero-quotepaper-w-glow)"/>
  </g>
