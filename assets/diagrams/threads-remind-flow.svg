<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="flowTitle flowDesc" style="font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <title id="flowTitle">알림 자동화의 흐름</title>
  <desc id="flowDesc">깃허브 예약 실행기가 깃허브 서버 컴퓨터를 깨우면, 그 컴퓨터가 저장소에서 코드와 원고를 내려받아 텔레그램으로 보내고, 결과를 저장소에 다시 적습니다.</desc>

  <!-- data-standalone 이 붙은 둘은 이 파일을 그냥 열어봤을 때만 씁니다.
       글에 펴 넣을 때는 빠지고, 색은 사이트의 --card, --text 를 그대로 받습니다.
       아이콘 id 에 icw- 를 붙인 이유는, 가로와 세로가 한 페이지에 같이 들어가기 때문입니다.
       id 가 겹치면 뒤에 온 쪽이 앞의 것을 가리켜 엉뚱한 그림이 나옵니다. -->
  <style data-standalone>
    svg { --card:#ffffff; --border:#e2e8f0; --text:#16202e; --muted:#5a6b83; --accent:#0f9d76; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --card:#161c26; --border:#232b38; --text:#e6ebf3; --muted:#9aa7bd; --accent:#6ee7b7; --bg:#0e1116; }
    }
  </style>
  <rect data-standalone x="0" y="0" width="900" height="380" fill="var(--bg,#ffffff)"/>

  <defs>
    <marker id="dgw-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#9aa7bd)"/>
    </marker>
    <marker id="dgw-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#6ee7b7)"/>
    </marker>

    <g id="icw-base" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <symbol id="icw-repo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
      <path d="M8.5 3v18"/>
    </symbol>
    <symbol id="icw-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/>
      <path d="M12 7.5V12l3 1.9"/>
    </symbol>
    <symbol id="icw-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="4.5" width="17" height="6" rx="1.6"/>
      <rect x="3.5" y="13.5" width="17" height="6" rx="1.6"/>
      <path d="M7 7.5h.01M7 16.5h.01"/>
    </symbol>
    <symbol id="icw-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.5 2.5 15 21.5l-3.8-8.7-8.7-3.8z"/>
      <path d="M21.5 2.5 11.2 12.8"/>
    </symbol>
    <symbol id="icw-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6.5" y="2.5" width="11" height="19" rx="2.6"/>
      <path d="M10.5 18.4h3"/>
    </symbol>
  </defs>

  <g fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.5">
    <rect x="16"  y="170" width="184" height="104" rx="10"/>
    <rect x="244" y="170" width="184" height="104" rx="10"/>
    <rect x="472" y="170" width="184" height="104" rx="10"/>
    <rect x="700" y="170" width="184" height="104" rx="10"/>
  </g>
  <rect x="244" y="30" width="184" height="86" rx="10" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/>

  <!-- 아이콘은 사각형 위변 한가운데에 배지로 얹습니다. 테두리 선은 배지 바탕이 덮습니다. -->
  <g fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.5">
    <circle cx="108" cy="170" r="15"/>
    <circle cx="336" cy="170" r="15"/>
    <circle cx="564" cy="170" r="15"/>
    <circle cx="792" cy="170" r="15"/>
  </g>
  <circle cx="336" cy="30" r="15" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/>

  <g style="color:var(--muted,#9aa7bd)">
    <use href="#icw-repo"   x="99"  y="161" width="18" height="18"/>
    <use href="#icw-server" x="327" y="161" width="18" height="18"/>
    <use href="#icw-send"   x="555" y="161" width="18" height="18"/>
    <use href="#icw-phone"  x="783" y="161" width="18" height="18"/>
  </g>
  <use href="#icw-clock" x="327" y="21" width="18" height="18" style="color:var(--accent,#6ee7b7)"/>

  <g fill="var(--text,#e6ebf3)" font-size="15" font-weight="600" text-anchor="middle">
    <text x="108" y="202">내 저장소</text>
    <text x="336" y="62">깃허브 예약 실행기</text>
    <text x="336" y="202">깃허브 서버 컴퓨터</text>
    <text x="564" y="202">텔레그램</text>
    <text x="792" y="202">내 폰</text>
  </g>
  <g fill="var(--muted,#9aa7bd)" font-size="12.5" text-anchor="middle">
    <text x="108" y="226">원고 파일과 코드</text>
    <text x="336" y="226">코드가 여기서 실행됩니다</text>
    <text x="564" y="226">메시지를 24시간 보관</text>
    <text x="792" y="226">복사해서 직접 올립니다</text>
  </g>
  <text x="336" y="86" fill="var(--accent,#6ee7b7)" font-size="12.5" font-weight="600" text-anchor="middle">여기가 제때 안 깨어납니다</text>
  <g fill="var(--muted,#9aa7bd)" font-size="11" text-anchor="middle" opacity="0.85">
    <text x="108" y="254">우리 것</text>
    <text x="336" y="106">깃허브 것</text>
    <text x="336" y="254">깃허브 것</text>
    <text x="564" y="254">외부 서비스</text>
    <text x="792" y="254">사람</text>
  </g>

  <g stroke="var(--muted,#9aa7bd)" stroke-width="1.8" fill="none" marker-end="url(#dgw-a)">
    <path d="M200,222 H236"/>
    <path d="M428,222 H464"/>
    <path d="M656,222 H692"/>
    <path d="M336,274 V318 H108 V280"/>
  </g>
  <path d="M336,116 V150" stroke="var(--accent,#6ee7b7)" stroke-width="2" fill="none" marker-end="url(#dgw-b)"/>

  <g fill="var(--muted,#9aa7bd)" font-size="11.5" text-anchor="middle">
    <text x="218" y="212">내려받기</text>
    <text x="446" y="212">원고 전송</text>
    <text x="674" y="212">알림 도착</text>
    <text x="230" y="336">올렸다는 표시를 저장소에 다시 적습니다</text>
  </g>
  <text x="356" y="140" fill="var(--accent,#6ee7b7)" font-size="11.5" text-anchor="start">회차를 만들어 깨움</text>
</svg>
