<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 620" width="360" height="620" role="img" aria-label="The same flow drawn vertically" style="font-family:system-ui,-apple-system,sans-serif">
  <!-- Phone layout. Shrinking the wide drawing to a phone puts it at 0.38 scale,
       which renders 11.5px labels at 4.4px.
       Reads top to bottom as one sentence: the code in my repository, woken by the scheduler,
       runs on a GitHub server, goes out to Telegram, lands on my phone.
       Icons sit on the left edge. Ids are prefixed icen- because the wide and narrow
       drawings share one page and duplicate ids would collide.
       Same content as threads-remind-flow-en.svg. Keep the two in sync. -->
  <style data-standalone>
    svg { --card:#ffffff; --border:#e2e8f0; --text:#16202e; --muted:#5a6b83; --accent:#0f9d76; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --card:#161c26; --border:#232b38; --text:#e6ebf3; --muted:#9aa7bd; --accent:#6ee7b7; --bg:#0e1116; }
    }
  </style>
  <rect data-standalone x="0" y="0" width="360" height="620" fill="var(--bg,#ffffff)"/>

  <defs>
    <marker id="dgen-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#9aa7bd)"/>
    </marker>
    <marker id="dgen-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#6ee7b7)"/>
    </marker>

    <symbol id="icen-repo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
      <path d="M8.5 3v18"/>
    </symbol>
    <symbol id="icen-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/>
      <path d="M12 7.5V12l3 1.9"/>
    </symbol>
    <symbol id="icen-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="4.5" width="17" height="6" rx="1.6"/>
      <rect x="3.5" y="13.5" width="17" height="6" rx="1.6"/>
      <path d="M7 7.5h.01M7 16.5h.01"/>
    </symbol>
    <symbol id="icen-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.5 2.5 15 21.5l-3.8-8.7-8.7-3.8z"/>
      <path d="M21.5 2.5 11.2 12.8"/>
    </symbol>
    <symbol id="icen-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6.5" y="2.5" width="11" height="19" rx="2.6"/>
      <path d="M10.5 18.4h3"/>
    </symbol>
  </defs>

  <g fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.5">
    <rect x="84" y="6"   width="246" height="76" rx="10"/>
    <rect x="84" y="256" width="246" height="76" rx="10"/>
    <rect x="84" y="376" width="246" height="76" rx="10"/>
    <rect x="84" y="496" width="246" height="76" rx="10"/>
  </g>
  <rect x="84" y="126" width="246" height="86" rx="10" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/>

  <g fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.5">
    <circle cx="84" cy="44"  r="15"/>
    <circle cx="84" cy="294" r="15"/>
    <circle cx="84" cy="414" r="15"/>
    <circle cx="84" cy="534" r="15"/>
  </g>
  <circle cx="84" cy="169" r="15" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/>

  <g style="color:var(--muted,#9aa7bd)">
    <use href="#icen-repo"   x="75" y="35"  width="18" height="18"/>
    <use href="#icen-server" x="75" y="285" width="18" height="18"/>
    <use href="#icen-send"   x="75" y="405" width="18" height="18"/>
    <use href="#icen-phone"  x="75" y="525" width="18" height="18"/>
  </g>
  <use href="#icen-clock" x="75" y="160" width="18" height="18" style="color:var(--accent,#6ee7b7)"/>

  <g fill="var(--text,#e6ebf3)" font-size="14" font-weight="600" text-anchor="middle">
    <text x="215" y="36">My repository</text>
    <text x="215" y="156">GitHub scheduler</text>
    <text x="215" y="286">GitHub server</text>
    <text x="215" y="406">Telegram</text>
    <text x="215" y="526">My phone</text>
  </g>
  <g fill="var(--muted,#9aa7bd)" font-size="11" text-anchor="middle">
    <text x="215" y="56">drafts and code</text>
    <text x="215" y="306">runs my code</text>
    <text x="215" y="426">holds messages 24h</text>
    <text x="215" y="546">I paste it in myself</text>
  </g>
  <text x="215" y="176" fill="var(--accent,#6ee7b7)" font-size="11" font-weight="600" text-anchor="middle">this is what oversleeps</text>
  <g fill="var(--muted,#9aa7bd)" font-size="10" text-anchor="middle" opacity="0.85">
    <text x="215" y="74">mine</text>
    <text x="215" y="196">GitHub's</text>
    <text x="215" y="324">GitHub's</text>
    <text x="215" y="444">outside service</text>
    <text x="215" y="564">a person</text>
  </g>

  <g stroke="var(--muted,#9aa7bd)" stroke-width="1.8" fill="none" marker-end="url(#dgen-a)">
    <path d="M215,86 V122"/>
    <path d="M215,336 V372"/>
    <path d="M215,456 V492"/>
  </g>
  <path d="M215,216 V252" stroke="var(--accent,#6ee7b7)" stroke-width="2" fill="none" marker-end="url(#dgen-b)"/>

  <path d="M84,316 H44 V24 H74" stroke="var(--muted,#9aa7bd)" stroke-width="1.8" fill="none" marker-end="url(#dgen-a)"/>
  <text transform="rotate(-90 24 250)" x="24" y="250" fill="var(--muted,#9aa7bd)" font-size="10" text-anchor="middle">writes the mark back</text>

  <g fill="var(--muted,#9aa7bd)" font-size="10.5" text-anchor="start">
    <text x="223" y="108">the code in here</text>
    <text x="223" y="358">sends the draft</text>
    <text x="223" y="478">alert lands</text>
  </g>
  <text x="223" y="238" fill="var(--accent,#6ee7b7)" font-size="10.5" text-anchor="start">gets woken</text>
</svg>
