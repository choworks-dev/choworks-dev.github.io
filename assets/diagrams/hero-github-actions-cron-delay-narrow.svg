    <rect x="0" y="0" width="360" height="320" fill="url(#hero-cron-n-dots)"/>
    <ellipse cx="180" cy="190" rx="190" ry="150" fill="url(#hero-cron-n-glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="358.5" height="318.5" rx="14" fill="none" stroke="var(--border,#232b38)" stroke-width="1.5"/>
