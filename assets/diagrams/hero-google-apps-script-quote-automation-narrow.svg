<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320" role="img" aria-label="모래시계 옆으로 위는 손으로 하던 시절의 긴 단계이고 아래는 지금의 두 단계입니다. 같은 일인데 지나는 자리가 줄었습니다." style="font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <!-- scripts/make-hero.js 가 만든 파일입니다. 손으로 고치지 마세요. 다음 실행 때 덮어씁니다.
       고칠 곳은 scripts/hero-specs.js 의 "quote" 항목입니다.
       폰용 세로 배치입니다. 가로를 그대로 줄이면 아래 한 줄이 5px 로 찍힙니다.
       짝은 가로 파일이고 둘 다 같은 항목에서 나옵니다.
       data-standalone 이 붙은 것은 이 파일을 그냥 열어봤을 때만 씁니다. 펴 넣을 때 빠지고,
       색은 사이트의 --card, --accent 를 그대로 받아 테마 토글을 따라옵니다. -->
  <style data-standalone>
    svg { --card:#ffffff; --bg-soft:#f5f7fa; --border:#e2e8f0; --text:#16202e; --muted:#5a6b83; --accent:#0f9d76; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --card:#161c26; --bg-soft:#141922; --border:#232b38; --text:#e6ebf3; --muted:#9aa7bd; --accent:#6ee7b7; --bg:#0e1116; }
    }
  </style>
  <rect data-standalone x="0" y="0" width="360" height="320" fill="var(--bg,#ffffff)"/>
  <defs>
    <linearGradient id="hero-quote-n-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="0.55" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="1" stop-color="var(--bg,#0e1116)"/>
    </linearGradient>
    <radialGradient id="hero-quote-n-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="var(--accent,#6ee7b7)" stop-opacity="0.20"/>
      <stop offset="1" stop-color="var(--accent,#6ee7b7)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-quote-n-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="var(--muted,#9aa7bd)" opacity="0.16"/>
    </pattern>
    <clipPath id="hero-quote-n-clip"><rect x="0" y="0" width="360" height="320" rx="14"/></clipPath>
    <marker id="hero-quote-n-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#9aa7bd)"/>
    </marker>
    <marker id="hero-quote-n-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#6ee7b7)"/>
    </marker>
  </defs>
  <g clip-path="url(#hero-quote-n-clip)">
    <rect x="0" y="0" width="360" height="320" fill="url(#hero-quote-n-panel)"/>
    <rect x="0" y="0" width="360" height="320" fill="url(#hero-quote-n-dots)"/>
    <ellipse class="hero-glow" cx="180" cy="190" rx="190" ry="140" fill="url(#hero-quote-n-glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="358.5" height="318.5" rx="14" fill="none" stroke="var(--border,#232b38)" stroke-width="1.5"/>
  <g transform="translate(120,24) scale(0.6)"><path d="M12,8 H108 V22 H12 Z" fill="var(--card,#161c26)" stroke="var(--muted,#9aa7bd)" stroke-width="2" stroke-linejoin="round"/><path d="M12,158 H108 V172 H12 Z" fill="var(--card,#161c26)" stroke="var(--muted,#9aa7bd)" stroke-width="2" stroke-linejoin="round"/><path d="M24,22 C24,62 58,82 58,90 C58,98 24,118 24,158" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="2" stroke-linecap="round" opacity="0.9"/><path d="M96,22 C96,62 62,82 62,90 C62,98 96,118 96,158" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="2" stroke-linecap="round" opacity="0.9"/><path d="M29,26 C29,58 56,80 60,86 C64,80 91,58 91,26 Z" fill="var(--muted,#9aa7bd)" stroke="none" stroke-width="0" stroke-linejoin="round" opacity="0.28"/><path d="M40,154 C44,132 54,120 60,120 C66,120 76,132 80,154 Z" fill="var(--accent,#6ee7b7)" stroke="none" stroke-width="0" stroke-linejoin="round" opacity="0.55"/><path d="M60,96 V146" fill="none" stroke="var(--accent,#6ee7b7)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 7" opacity="0.8"/></g><g opacity="0.45"><rect x="60" y="148" width="40" height="24" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="80" cy="160" r="3" fill="var(--muted,#9aa7bd)"/></g><path d="M100,160 H110" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/><g opacity="0.45"><rect x="110" y="148" width="40" height="24" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="130" cy="160" r="3" fill="var(--muted,#9aa7bd)"/></g><path d="M150,160 H160" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/><g opacity="0.45"><rect x="160" y="148" width="40" height="24" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="180" cy="160" r="3" fill="var(--muted,#9aa7bd)"/></g><path d="M200,160 H210" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/><g opacity="0.45"><rect x="210" y="148" width="40" height="24" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="230" cy="160" r="3" fill="var(--muted,#9aa7bd)"/></g><path d="M250,160 H260" fill="none" stroke="var(--muted,#9aa7bd)" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/><g opacity="0.45"><rect x="260" y="148" width="40" height="24" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="280" cy="160" r="3" fill="var(--muted,#9aa7bd)"/></g><rect x="66" y="214" width="100" height="36" rx="6" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/><circle cx="78" cy="232" r="3.3" fill="var(--muted,#9aa7bd)" opacity="0.9"/><rect x="91" y="226.4" width="34.72" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><rect x="91" y="234.4" width="21.28" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><path d="M166,232 H194" fill="none" stroke="var(--accent,#6ee7b7)" stroke-width="1.6" stroke-linecap="round"/><rect x="194" y="214" width="100" height="36" rx="6" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/><circle cx="206" cy="232" r="3.3" fill="var(--muted,#9aa7bd)" opacity="0.9"/><rect x="219" y="226.4" width="30.8" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><rect x="219" y="234.4" width="39.2" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)"/><path d="M180,180 V206" fill="none" stroke="var(--accent,#6ee7b7)" stroke-width="2" stroke-linecap="round" marker-end="url(#hero-quote-n-aa)"/>
  <rect x="237" y="22" width="101" height="24" rx="12" fill="none" stroke="var(--border,#232b38)" stroke-width="1.4"/>
  <text x="287.5" y="38.5" fill="var(--muted,#9aa7bd)" font-size="11.5" font-weight="600" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0.08em">Automation</text>
  <g fill="var(--muted,#9aa7bd)" font-size="12" text-anchor="middle" style="letter-spacing:0.05em"><text x="180" y="280">요청 접수부터 발송까지</text><text x="180" y="299">지나는 자리가 줄었다</text></g>
</svg>
