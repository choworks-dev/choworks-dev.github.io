  <rect x="738" y="24" width="126" height="26" rx="13" fill="none" stroke="var(--border,#232b38)" stroke-width="1.4"/>
  <text x="801" y="41.5" fill="var(--muted,#9aa7bd)" font-size="12" font-weight="600" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0.08em">Data as Asset</text>
  <text x="450" y="277" fill="var(--muted,#9aa7bd)" font-size="12.5" text-anchor="middle" style="letter-spacing:0.06em">이메일 · 메신저 · 소스코드 · 그리고 지우지 않은 시간</text>
