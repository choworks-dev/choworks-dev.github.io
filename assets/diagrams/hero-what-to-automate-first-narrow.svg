<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320" role="img" aria-label="계단처럼 놓인 칸들 가운데 왼쪽 아래 첫 칸만 또렷합니다. 무엇을 하느냐보다 어디서부터냐가 먼저입니다." style="font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <!-- scripts/make-hero.js 가 만든 파일입니다. 손으로 고치지 마세요. 다음 실행 때 덮어씁니다.
       고칠 곳은 scripts/hero-specs.js 의 "steps" 항목입니다.
       폰용 세로 배치입니다. 가로를 그대로 줄이면 아래 한 줄이 5px 로 찍힙니다.
       짝은 가로 파일이고 둘 다 같은 항목에서 나옵니다.
       data-standalone 이 붙은 것은 이 파일을 그냥 열어봤을 때만 씁니다. 펴 넣을 때 빠지고,
       색은 사이트의 --card, --accent 를 그대로 받아 테마 토글을 따라옵니다. -->
  <style data-standalone>
    svg { --card:#ffffff; --bg-soft:#f5f7fa; --border:#e2e8f0; --text:#16202e; --muted:#5a6b83; --accent:#0f9d76; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --card:#161c26; --bg-soft:#141922; --border:#232b38; --text:#e6ebf3; --muted:#9aa7bd; --accent:#6ee7b7; --bg:#0e1116; }
    }
  </style>
  <rect data-standalone x="0" y="0" width="360" height="320" fill="var(--bg,#ffffff)"/>
  <defs>
    <linearGradient id="hero-steps-n-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="0.55" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="1" stop-color="var(--bg,#0e1116)"/>
    </linearGradient>
    <radialGradient id="hero-steps-n-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="var(--accent,#6ee7b7)" stop-opacity="0.20"/>
      <stop offset="1" stop-color="var(--accent,#6ee7b7)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-steps-n-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="var(--muted,#9aa7bd)" opacity="0.16"/>
    </pattern>
    <clipPath id="hero-steps-n-clip"><rect x="0" y="0" width="360" height="320" rx="14"/></clipPath>
    <marker id="hero-steps-n-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#9aa7bd)"/>
    </marker>
    <marker id="hero-steps-n-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#6ee7b7)"/>
    </marker>
  </defs>
  <g clip-path="url(#hero-steps-n-clip)">
    <rect x="0" y="0" width="360" height="320" fill="url(#hero-steps-n-panel)"/>
    <rect x="0" y="0" width="360" height="320" fill="url(#hero-steps-n-dots)"/>
    <ellipse class="hero-glow" cx="110" cy="230" rx="190" ry="150" fill="url(#hero-steps-n-glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="358.5" height="318.5" rx="14" fill="none" stroke="var(--border,#232b38)" stroke-width="1.5"/>
  <g opacity="0.44"><rect x="226" y="124" width="96" height="34" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="244" cy="141" r="3.4" fill="var(--muted,#9aa7bd)"/><rect x="258" y="139" width="44" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.5"/></g><g opacity="0.54"><rect x="164" y="164" width="96" height="34" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="182" cy="181" r="3.4" fill="var(--muted,#9aa7bd)"/><rect x="196" y="179" width="44" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.5"/></g><g opacity="0.64"><rect x="102" y="204" width="96" height="34" rx="6" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.4"/><circle cx="120" cy="221" r="3.4" fill="var(--muted,#9aa7bd)"/><rect x="134" y="219" width="44" height="3.6" rx="1.8" fill="var(--muted,#9aa7bd)" opacity="0.5"/></g><g opacity="1"><rect x="40" y="244" width="96" height="34" rx="6" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/><circle cx="58" cy="261" r="3.4" fill="var(--accent,#6ee7b7)"/><rect x="72" y="259" width="44" height="3.6" rx="1.8" fill="var(--accent,#6ee7b7)" opacity="0.8"/></g>
  <rect x="237" y="22" width="101" height="24" rx="12" fill="none" stroke="var(--border,#232b38)" stroke-width="1.4"/>
  <text x="287.5" y="38.5" fill="var(--muted,#9aa7bd)" font-size="11.5" font-weight="600" text-anchor="middle" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0.08em">Start Here</text>
  <g fill="var(--muted,#9aa7bd)" font-size="12" text-anchor="middle" style="letter-spacing:0.05em"><text x="180" y="280">무엇을 없앨까보다</text><text x="180" y="299">어디서부터가 먼저다</text></g>
</svg>
