<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="vfTitleEn vfDescEn" style="font-family:system-ui,'Segoe UI',sans-serif">
  <title id="vfTitleEn">Same records, different price</title>
  <desc id="vfDescEn">The internal email, chat logs and source code a company piles up would have been quietly deleted a few years ago. In August 2026 the same data sold to Google for ten million dollars. The data did not change. The buyer did.</desc>

  <!-- Elements marked data-standalone are only for viewing this file on its own.
       They are stripped when the SVG is inlined, so colors follow the site's --card and --text
       and the theme toggle works. Icon ids are prefixed vfw- because the wide and narrow
       versions land on the same page; duplicate ids make the second point at the first.
       The two cards say exactly the same thing on purpose. That is the whole drawing. -->
  <style data-standalone>
    svg { --card:#ffffff; --border:#e2e8f0; --text:#16202e; --muted:#5a6b83; --accent:#0f9d76; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --card:#161c26; --border:#232b38; --text:#e6ebf3; --muted:#9aa7bd; --accent:#6ee7b7; --bg:#0e1116; }
    }
  </style>
  <rect data-standalone x="0" y="0" width="900" height="360" fill="var(--bg,#ffffff)"/>

  <defs>
    <marker id="vfw-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#9aa7bd)"/>
    </marker>
    <symbol id="vfw-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="5" width="19" height="14" rx="2.2"/>
      <path d="M3.4 6.6 12 13l8.6-6.4"/>
    </symbol>
    <symbol id="vfw-msg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.6 4.5h14.8a1.6 1.6 0 0 1 1.6 1.6v8a1.6 1.6 0 0 1-1.6 1.6H10.4L6 19.4v-3.7H4.6A1.6 1.6 0 0 1 3 14.1v-8a1.6 1.6 0 0 1 1.6-1.6z"/>
    </symbol>
    <symbol id="vfw-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.4 7.4 3.8 12l4.6 4.6"/>
      <path d="M15.6 7.4 20.2 12l-4.6 4.6"/>
    </symbol>
    <symbol id="vfw-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6.6h16"/>
      <path d="M9.2 6.6V4.4h5.6v2.2"/>
      <path d="M6.4 6.6 7.5 20h9l1.1-13.4"/>
    </symbol>
    <symbol id="vfw-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.6 12.6 12.4 20.8 3.4 11.8V3.4h8.4z"/>
      <circle cx="8.2" cy="8.2" r="1.5"/>
    </symbol>
  </defs>

  <g fill="var(--muted,#9aa7bd)" font-size="13" font-weight="600" text-anchor="middle">
    <text x="185" y="58">A few years ago</text>
  </g>
  <text x="715" y="58" fill="var(--accent,#6ee7b7)" font-size="13" font-weight="600" text-anchor="middle">August 2026</text>

  <rect x="40"  y="84" width="290" height="170" rx="10" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.5"/>
  <rect x="570" y="84" width="290" height="170" rx="10" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/>

  <!-- Elements marked data-standalone are only for viewing this file on its own.
       They are stripped when the SVG is inlined, so colors follow the site's --card and --text
       and the theme toggle works. Icon ids are prefixed vfw- because the wide and narrow
       versions land on the same page; duplicate ids make the second point at the first.
       The two cards say exactly the same thing on purpose. That is the whole drawing. -->
  <circle cx="185" cy="84" r="15" fill="var(--card,#161c26)" stroke="var(--border,#232b38)" stroke-width="1.5"/>
  <circle cx="715" cy="84" r="15" fill="var(--card,#161c26)" stroke="var(--accent,#6ee7b7)" stroke-width="2"/>
  <use href="#vfw-trash" x="176" y="75" width="18" height="18" style="color:var(--muted,#9aa7bd)"/>
  <use href="#vfw-tag"   x="706" y="75" width="18" height="18" style="color:var(--accent,#6ee7b7)"/>

  <g style="color:var(--muted,#9aa7bd)">
    <use href="#vfw-mail" x="68"  y="121" width="17" height="17"/>
    <use href="#vfw-msg"  x="68"  y="161" width="17" height="17"/>
    <use href="#vfw-code" x="68"  y="201" width="17" height="17"/>
    <use href="#vfw-mail" x="598" y="121" width="17" height="17"/>
    <use href="#vfw-msg"  x="598" y="161" width="17" height="17"/>
    <use href="#vfw-code" x="598" y="201" width="17" height="17"/>
  </g>

  <g fill="var(--text,#e6ebf3)" font-size="14.5" text-anchor="start">
    <text x="96"  y="134">100M internal emails</text>
    <text x="96"  y="174">500M Teams messages</text>
    <text x="96"  y="214">30M lines of code</text>
    <text x="626" y="134">100M internal emails</text>
    <text x="626" y="174">500M Teams messages</text>
    <text x="626" y="214">30M lines of code</text>
  </g>

  <path d="M346,169 H548" stroke="var(--muted,#9aa7bd)" stroke-width="1.8" fill="none" marker-end="url(#vfw-a)"/>
  <g fill="var(--muted,#9aa7bd)" font-size="12.5" text-anchor="middle">
    <text x="451" y="150">Only time passed</text>
    <text x="451" y="192">The data is identical</text>
  </g>

  <text x="185" y="294" fill="var(--muted,#9aa7bd)" font-size="21" font-weight="700" text-anchor="middle">Deleted</text>
  <text x="715" y="294" fill="var(--accent,#6ee7b7)" font-size="21" font-weight="700" text-anchor="middle">$10 million</text>
  <g fill="var(--muted,#9aa7bd)" font-size="12.5" text-anchor="middle">
    <text x="185" y="317">A storage cost, nothing more</text>
    <text x="715" y="317">Google, at a bankruptcy auction</text>
  </g>

  <text x="450" y="347" fill="var(--text,#e6ebf3)" font-size="13" font-weight="600" text-anchor="middle">What changed was not the record. It was who showed up to buy it.</text>
</svg>
