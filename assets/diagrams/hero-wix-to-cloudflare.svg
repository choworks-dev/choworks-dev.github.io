<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="hero-wix-w-t hero-wix-w-d" style="font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <title id="hero-wix-w-t">집을 옮기고 나서 끊긴 고정비</title>
  <desc id="hero-wix-w-d">낡은 집에서 새 집으로 옮깁니다. 아래에 달마다 서던 막대가 어느 달부터 서지 않고, 끊긴 자리에 세로선이 있습니다.</desc>
  <!-- scripts/make-hero.js 가 만든 파일입니다. 손으로 고치지 마세요. 다음 실행 때 덮어씁니다.
       고칠 곳은 scripts/hero-specs.js 의 "wix" 항목입니다.
       넓은 화면용입니다.
       짝은 narrow 파일이고 둘 다 같은 항목에서 나옵니다.
       data-standalone 이 붙은 것은 이 파일을 그냥 열어봤을 때만 씁니다. 펴 넣을 때 빠지고,
       색은 사이트의 --card, --accent 를 그대로 받아 테마 토글을 따라옵니다. -->
  <style data-standalone>
    svg { --card:#ffffff; --bg-soft:#f5f7fa; --border:#e2e8f0; --text:#16202e; --muted:#5a6b83; --accent:#0f9d76; --bg:#ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --card:#161c26; --bg-soft:#141922; --border:#232b38; --text:#e6ebf3; --muted:#9aa7bd; --accent:#6ee7b7; --bg:#0e1116; }
    }
  </style>
  <rect data-standalone x="0" y="0" width="900" height="300" fill="var(--bg,#ffffff)"/>
  <defs>
    <linearGradient id="hero-wix-w-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="0.55" stop-color="var(--bg-soft,#141922)"/>
      <stop offset="1" stop-color="var(--bg,#0e1116)"/>
    </linearGradient>
    <radialGradient id="hero-wix-w-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="var(--accent,#6ee7b7)" stop-opacity="0.20"/>
      <stop offset="1" stop-color="var(--accent,#6ee7b7)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-wix-w-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="var(--muted,#9aa7bd)" opacity="0.16"/>
    </pattern>
    <clipPath id="hero-wix-w-clip"><rect x="0" y="0" width="900" height="300" rx="14"/></clipPath>
    <marker id="hero-wix-w-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted,#9aa7bd)"/>
    </marker>
    <marker id="hero-wix-w-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#6ee7b7)"/>
    </marker>
  </defs>
  <g clip-path="url(#hero-wix-w-clip)">
    <rect x="0" y="0" width="900" height="300" fill="url(#hero-wix-w-panel)"/>
    <rect x="0" y="0" width="900" height="300" fill="url(#hero-wix-w-dots)"/>
    <ellipse cx="560" cy="130" rx="320" ry="150" fill="url(#hero-wix-w-glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="14" fill="none" stroke="var(--border,#232b38)" stroke-width="1.5"/>
